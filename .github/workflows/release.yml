# Release workflow for terraform-provider-garage
#
# Triggered on:
#   - Push of semantic version tags (v1.0.0, v0.1.0, etc.)
#   - Manual dispatch via GitHub UI
#
# This workflow:
#   1. Builds binaries for all supported platforms
#   2. Creates SHA256 checksums
#   3. Signs checksums with GPG
#   4. Uploads release artifacts to GitHub
#   5. Publishes the platform packages to GHCR for OpenTofu's oci_mirror

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Matches v1.0.0, v0.1.0-alpha, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.18.1

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch releases the requested tag; a tag push releases
          # the ref that triggered the run.
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.tag || github.ref_name }}

  verify:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: always()
    steps:
      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Verifying release for tag: $TAG"

          # Wait for release to be available
          sleep 10

          # Check release exists and has expected assets
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets,tagName,name

          echo "Release verification complete"

  oci:
    name: Publish OCI mirror
    needs: goreleaser
    uses: ./.github/workflows/oci-release.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
